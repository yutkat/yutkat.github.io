name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Runs daily to pick up newly published Pages sites in the product list
  schedule:
    - cron: "0 0 * * *"

permissions: {}

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Generate product list
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Repos with GitHub Pages, excluding forks, archived, the profile repo and this site
          LIST=$(gh api "users/$OWNER/repos?per_page=100" --paginate --jq '
            .[] | select(.has_pages and (.fork | not) and (.archived | not)
              and (.name | IN(env.OWNER, env.OWNER + ".github.io") | not))
            | "- [\(.name)](https://\(env.OWNER).github.io/\(.name)/)"')
          export LIST
          awk '
            /<!-- PRODUCT-LIST:START -->/ { print; print ENVIRON["LIST"]; skip = 1; next }
            /<!-- PRODUCT-LIST:END -->/ { skip = 0 }
            !skip
          ' README.md > README.md.tmp
          mv README.md.tmp README.md
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Publish .well-known (dotfiles are excluded by default since v4)
          include-hidden-files: true

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
