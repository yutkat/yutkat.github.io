<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+JP:wght@400;600&display=swap">
<style>
  body { font-family: Inter, "Noto Sans JP", system-ui, sans-serif; font-size: 15px; line-height: 1.7; }
  h2, h3 { margin-top: 2em; letter-spacing: .02em; }
  section li { margin: .2em 0; }
  a { text-decoration: none; }
  a:hover, a:focus { text-decoration: underline; }
  summary { cursor: pointer; color: var(--clr-h-3-6); }
  footer { display: none; }
  /* Single column: small avatar beside the site description, repo link at the bottom */
  div.wrapper { width: auto; max-width: 640px; margin: 0 auto; padding-top: 3em; display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: center; }
  header { display: contents; }
  header img { grid-area: 1 / 1; width: 40px; height: 40px; border-radius: 50%; }
  header h1 { display: none; }
  header p:not(.view) { grid-area: 1 / 2; margin: 0; font-size: 1.6em; font-weight: 600; color: var(--clr-h1); }
  header p.view { display: block; position: static; grid-column: 1 / -1; order: 1; font-size: .85em; text-align: right; }
  section { grid-column: 1 / -1; float: none; position: static; width: auto; }
  /* README's "# yutkat.github.io" duplicates the site title */
  section > h1:first-child { display: none; }
</style>
