title: yutkat
description: yutkat's website
logo: https://avatars.githubusercontent.com/u/8683947
show_downloads: false
plugins:
  - jekyll-sitemap
  - jekyll-remote-theme
google_analytics: G-LFN9ZWJFXX
remote_theme: "godalming123/minimal"
#theme: jekyll-theme-minimal
include: [".well-known"]
# Show "View the Project on GitHub" (repo link) instead of the profile link in the theme header
github:
  is_user_page: false
  is_project_page: true
# Default image for social link previews (jekyll-seo-tag)
defaults:
  - scope:
      path: ""
    values:
      image: https://avatars.githubusercontent.com/u/8683947
# Square avatar: keep the small card instead of summary_large_image
twitter:
  card: summary
